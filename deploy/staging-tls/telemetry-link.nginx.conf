# Device Link over TLS on Staging: wss://mobile.konstek.de:8443/api/device/v1/link -> telemetry:8080.
# Install: /etc/nginx/sites-available/telemetry-link, symlink into sites-enabled, `nginx -t && systemctl reload nginx`.
# Certificate: certbot certonly --nginx -d mobile.konstek.de --key-type ecdsa --elliptic-curve secp256r1 \
#   --deploy-hook "systemctl reload nginx"
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name mobile.konstek.de;

    ssl_certificate     /etc/letsencrypt/live/mobile.konstek.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobile.konstek.de/privkey.pem;

    # Device: TLS 1.2, ECDHE-ECDSA + AES-GCM, curves P-256/P-384
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # Session resumption: tickets and a session cache
    ssl_session_tickets on;
    ssl_session_cache shared:DeviceLink:10m;
    ssl_session_timeout 1d;

    location = /api/device/v1/link {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;     # longer than the ping interval (30 s)
        proxy_send_timeout 120s;
    }

    location / { return 404; }
}
